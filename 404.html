<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | SkyLabs</title>
  <link rel="icon" type="image/png" href="Favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 78% 22%, rgba(120, 165, 255, 0.08) 0%, transparent 46%),
        radial-gradient(circle at 20% 85%, rgba(255, 255, 255, 0.04) 0%, transparent 52%),
        linear-gradient(180deg, #05070c 0%, #080b13 55%, #05070c 100%);
      color: #f5f7fb;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Top Minimal Header */
    .sl-404-header {
      width: 100%;
      padding: 24px 36px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(5, 7, 12, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .sl-404-header-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .sl-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #ffffff;
    }

    .sl-brand-img {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
    }

    .sl-brand-name {
      font-size: 22px;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .sl-header-link {
      font-size: 15px;
      font-weight: 400;
      color: rgba(245, 247, 251, 0.82);
      text-decoration: none;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .sl-header-link:hover {
      background: #ffffff;
      color: #080b10;
    }

    /* Main Centered 404 Stage */
    .sl-404-main {
      flex: 1 0 auto;
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      padding: 88px 36px 96px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sl-404-card {
      width: 100%;
      padding: 56px 48px;
      border-radius: 32px;
      background: rgba(11, 15, 24, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 28px 72px rgba(0, 0, 0, 0.72);
      text-align: center;
      opacity: 0;
      transform: translateY(22px);
      transition:
        opacity 0.72s cubic-bezier(0.22, 1, 0.36, 1),
        transform 0.78s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .sl-404-card.is-ready {
      opacity: 1;
      transform: translateY(0);
    }

    .sl-404-pill {
      display: inline-block;
      padding: 6px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(245, 247, 251, 0.86);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      margin-bottom: 20px;
    }

    .sl-404-code {
      font-size: clamp(72px, 12vw, 132px);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.04em;
      color: #ffffff;
      margin-bottom: 18px;
    }

    .sl-404-title {
      font-size: clamp(26px, 3.4vw, 40px);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 14px;
    }

    .sl-404-copy {
      max-width: 560px;
      margin: 0 auto 32px;
      font-size: clamp(16.5px, 1.45vw, 19px);
      font-weight: 300;
      line-height: 1.65;
      color: rgba(245, 247, 251, 0.76);
    }

    .sl-404-path {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      vertical-align: bottom;
      padding: 3px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(245, 247, 251, 0.9);
      font-size: 14.5px;
    }

    .sl-404-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 36px;
    }

    .sl-btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      padding: 0 28px;
      border-radius: 999px;
      background: #ffffff;
      color: #080b10;
      font-family: inherit;
      font-size: 16.5px;
      font-weight: 400;
      text-decoration: none;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .sl-btn-primary:hover {
      background: #e9eef8;
      transform: translateY(-1px);
    }

    .sl-btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 50px;
      padding: 0 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-family: inherit;
      font-size: 16.5px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .sl-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
    }

    /* Quick Destinations */
    .sl-404-quick {
      padding-top: 28px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 22px;
    }

    .sl-404-quick-label {
      font-size: 14.5px;
      color: rgba(245, 247, 251, 0.56);
    }

    .sl-404-quick a {
      font-size: 15px;
      font-weight: 400;
      color: rgba(245, 247, 251, 0.84);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .sl-404-quick a:hover {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    /* Minimal Footer */
    .sl-404-footer {
      width: 100%;
      padding: 24px 36px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14.5px;
      color: rgba(245, 247, 251, 0.58);
    }

    .sl-404-footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    @media (max-width: 720px) {
      .sl-404-header {
        padding: 18px 20px;
      }
      .sl-404-main {
        padding: 48px 20px 64px;
      }
      .sl-404-card {
        padding: 36px 22px;
        border-radius: 24px;
      }
      .sl-404-actions {
        flex-direction: column;
      }
      .sl-btn-primary,
      .sl-btn-secondary {
        width: 100%;
      }
      .sl-404-footer {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="sl-404-header">
    <div class="sl-404-header-inner">
      <a href="index.html" class="sl-brand" aria-label="SkyLabs Home">
        <img
          src="Favicon.png"
          onerror="this.onerror=null; this.src='Logo.jpg';"
          alt="SkyLabs Logo"
          class="sl-brand-img"
        />
        <span class="sl-brand-name">SkyLabs</span>
      </a>
      <a href="join.html" class="sl-header-link">Join</a>
    </div>
  </header>

  <main class="sl-404-main">
    <section class="sl-404-card" id="sl404Card" aria-labelledby="sl404Heading">
      <span class="sl-404-pill">Off Course</span>
      <div class="sl-404-code" aria-hidden="true">404</div>
      <h1 class="sl-404-title" id="sl404Heading">This page could not be found</h1>
      <p class="sl-404-copy">
        The link you opened (<span class="sl-404-path" id="slMissingPath">/unknown</span>) may have moved or no longer exists. Head back home or jump straight into a lab.
      </p>

      <div class="sl-404-actions">
        <a href="index.html" class="sl-btn-primary">Go to SkyLabs Home</a>
        <button type="button" class="sl-btn-secondary" id="slGoBackBtn">Go Back</button>
      </div>

   
    </section>
  </main>

  <footer class="sl-404-footer">
    <div class="sl-404-footer-inner">
      <span id="sl404Copy">SkyLabs</span>
      <span>Space labs &amp; classrooms</span>
    </div>
  </footer>

  <script>
    (function () {
      const card = document.getElementById('sl404Card');
      const pathEl = document.getElementById('slMissingPath');
      const backBtn = document.getElementById('slGoBackBtn');
      const copyEl = document.getElementById('sl404Copy');

      if (pathEl && window.location && window.location.pathname) {
        pathEl.textContent = window.location.pathname || '/';
      }

      if (copyEl) {
        copyEl.textContent = '\u00A9 ' + new Date().getFullYear() + ' SkyLabs. All rights reserved.';
      }

      if (backBtn) {
        backBtn.addEventListener('click', function () {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = 'index.html';
          }
        });
      }

      requestAnimationFrame(function () {
        if (card) card.classList.add('is-ready');
      });
    })();
  </script>
</body>
</html>
