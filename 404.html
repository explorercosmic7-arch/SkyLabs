    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #030408;
        color: #f5f7fb;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .voyage-stage {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        background:
          radial-gradient(ellipse 85% 60% at 50% 20%, rgba(56, 86, 168, 0.24) 0%, rgba(12, 18, 38, 0.1) 55%, transparent 82%),
          radial-gradient(circle at 16% 80%, rgba(36, 56, 118, 0.18) 0%, transparent 50%),
          radial-gradient(circle at 86% 74%, rgba(22, 34, 76, 0.22) 0%, transparent 55%),
          #030408;
        overflow: hidden;
        isolation: isolate;
      }

      #starfield {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        display: block;
      }

      .center-shell {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 22px;
        text-decoration: none;
        color: #ffffff;
      }

      .brand img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 12px;
        display: block;
      }

      .brand span {
        font-size: clamp(24px, 3vw, 32px);
        font-weight: 500;
        letter-spacing: -0.025em;
      }

      .code {
        font-size: clamp(72px, 14vw, 136px);
        font-weight: 400;
        line-height: 0.96;
        letter-spacing: -0.04em;
        color: #ffffff;
        margin-bottom: 18px;
        text-shadow: 0 12px 48px rgba(0, 0, 0, 0.8);
      }

      p {
        font-size: clamp(20px, 2.8vw, 28px);
        font-weight: 300;
        line-height: 1.48;
        color: rgba(245, 247, 251, 0.84);
        max-width: 600px;
        margin: 0 auto 38px;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
      }

      .home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 14px 36px;
        border-radius: 999px;
        background: #ffffff;
        color: #04060b;
        font-family: 'Google Sans', sans-serif;
        font-size: clamp(18px, 2.1vw, 21px);
        font-weight: 500;
        text-decoration: none;
        letter-spacing: -0.01em;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease;
      }

      .home-btn:hover {
        background: #e9effd;
        transform: translateY(-2px);
      }

      @media (max-width: 640px) {
        .voyage-stage {
          padding: 36px 20px;
        }

        p {
          font-size: clamp(19px, 5vw, 24px);
          margin-bottom: 32px;
        }

        .home-btn {
          width: 100%;
          max-width: 340px;
          min-height: 56px;
        }
      }
    </style>
</head>
<body>
  <div class="voyage-stage">
    <canvas id="starfield" aria-hidden="true"></canvas>

    <main class="center-shell" aria-labelledby="notFoundCode">
      <a href="index.html" class="brand" aria-label="SkyLabs Home">
        <img
          src="/Favicon.png"
          onerror="this.onerror=null; this.src='/Logo.jpg';"
          alt="SkyLabs Logo"
        />
        <span>SkyLabs</span>
      </a>

      <h1 class="code" id="notFoundCode">404</h1>

      <p>This trajectory drifted off course and could not be found.</p>

      <a href="index.html" class="home-btn">Home</a>
    </main>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('starfield');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let stars = [];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(Math.max(Math.floor((width * height) / 6500), 80), 240);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.8 + 0.45,
          vx: (Math.random() - 0.5) * 0.16,
          vy: -(Math.random() * 0.22 + 0.06),
          alpha: Math.random() * 0.7 + 0.2,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function drawStars(time) {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          if (!prefersReducedMotion) {
            s.x += s.vx;
            s.y += s.vy;
            if (s.y < -4) s.y = height + 4;
            if (s.x < -4) s.x = width + 4;
            if (s.x > width + 4) s.x = -4;
          }

          const pulse = prefersReducedMotion
            ? s.alpha
            : s.alpha * (0.65 + 0.35 * Math.sin(time * 0.0015 * s.twinkleSpeed * 60 + s.phase));

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(235, 242, 255, ${Math.max(0.08, Math.min(0.95, pulse)).toFixed(3)})`;
          ctx.fill();
        }

        if (!prefersReducedMotion) {
          requestAnimationFrame(drawStars);
        }
      }

      resize();
      requestAnimationFrame(drawStars);
      window.addEventListener('resize', resize, { passive: true });
    })();
  </script>
</body>
</html>
