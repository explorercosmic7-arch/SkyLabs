    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: 'Google Sans', 'Inter', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #030408;
        color: #f5f7fb;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .space-stage {
        position: relative;
        width: 100vw;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        background:
          radial-gradient(ellipse 80% 55% at 50% 18%, rgba(42, 62, 118, 0.24) 0%, rgba(10, 14, 28, 0.08) 55%, transparent 80%),
          radial-gradient(circle at 18% 82%, rgba(28, 40, 82, 0.18) 0%, transparent 50%),
          radial-gradient(circle at 84% 76%, rgba(16, 24, 54, 0.22) 0%, transparent 55%),
          #030408;
        overflow: hidden;
        isolation: isolate;
      }

      #starfield {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        pointer-events: none;
        display: block;
      }

      .center-shell {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        margin-bottom: 24px;
      }

      .brand img {
        width: 48px;
        height: 48px;
        object-fit: contain;
        border-radius: 12px;
        display: block;
      }

      .brand span {
        font-size: clamp(24px, 3vw, 32px);
        font-weight: 500;
        letter-spacing: -0.025em;
        color: #ffffff;
      }

      .pill {
        display: inline-block;
        padding: 7px 18px;
        border-radius: 999px;
        font-size: clamp(13px, 1.5vw, 15px);
        font-weight: 500;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #c8d8ff;
        background: rgba(122, 162, 255, 0.12);
        border: 1px solid rgba(122, 162, 255, 0.26);
        margin-bottom: 22px;
      }

      h1 {
        font-size: clamp(44px, 8.5vw, 88px);
        font-weight: 400;
        line-height: 1.03;
        letter-spacing: -0.035em;
        color: #ffffff;
        margin-bottom: 22px;
        text-shadow: 0 10px 40px rgba(0, 0, 0, 0.75);
      }

      p {
        font-size: clamp(19px, 2.6vw, 26px);
        font-weight: 300;
        line-height: 1.52;
        color: rgba(245, 247, 251, 0.82);
        max-width: 650px;
        margin: 0 auto 38px;
        text-shadow: 0 4px 24px rgba(0, 0, 0, 0.85);
      }

      .actions {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        padding: 14px 34px;
        border-radius: 999px;
        font-family: 'Google Sans', sans-serif;
        font-size: clamp(17px, 2vw, 20px);
        font-weight: 500;
        text-decoration: none;
        letter-spacing: -0.01em;
        transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.2s ease, border-color 0.2s ease;
      }

      .btn-primary {
        background: #ffffff;
        color: #04060b;
      }

      .btn-primary:hover {
        background: #e9effd;
        transform: translateY(-2px);
      }

      .btn-secondary {
        background: rgba(10, 14, 24, 0.72);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.38);
        transform: translateY(-2px);
      }

      @media (max-width: 640px) {
        .space-stage {
          padding: 36px 20px;
        }

        .center-shell {
          max-width: 100%;
          align-items: center;
          justify-content: center;
          text-align: center;
        }

        .brand img {
          width: 44px;
          height: 44px;
        }

        h1 {
          font-size: clamp(42px, 12vw, 60px);
        }

        p {
          font-size: clamp(18px, 4.8vw, 22px);
          margin-bottom: 32px;
        }

        .actions {
          flex-direction: column;
          align-items: center;
          gap: 14px;
        }

        .btn {
          width: 100%;
          max-width: 360px;
          min-height: 56px;
          font-size: 19px;
        }
      }
    </style>
</head>
<body>
  <div class="space-stage">
    <canvas id="starfield" aria-hidden="true"></canvas>

    <main class="center-shell" aria-labelledby="docsTitle">
      <div class="brand">
        <img
          src="Favicon.png"
          onerror="this.onerror=null; this.src='Logo.jpg';"
          alt="SkyLabs Logo"
        />
        <span>SkyLabs</span>
      </div>

      <span class="pill">Next Edition · Updating Soon</span>

      <h1 id="docsTitle">Docs arrive in the next edition</h1>

      <p>
        The Docs page will be updated in the next edition. Need it quick? Contact the developers or explore our labs now.
      </p>

      <div class="actions">
        <a href="Labs.html" class="btn btn-primary">Explore Labs</a>
        <a href="Contact.html" class="btn btn-secondary">Contact Devs</a>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('starfield');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let width = 0;
      let height = 0;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let stars = [];

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const count = Math.min(Math.max(Math.floor((width * height) / 7000), 70), 220);
        stars = Array.from({ length: count }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.7 + 0.45,
          vx: (Math.random() - 0.5) * 0.14,
          vy: -(Math.random() * 0.18 + 0.05),
          alpha: Math.random() * 0.65 + 0.2,
          twinkleSpeed: Math.random() * 0.015 + 0.005,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function drawStars(time) {
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          if (!prefersReducedMotion) {
            s.x += s.vx;
            s.y += s.vy;
            if (s.y < -4) s.y = height + 4;
            if (s.x < -4) s.x = width + 4;
            if (s.x > width + 4) s.x = -4;
          }

          const pulse = prefersReducedMotion
            ? s.alpha
            : s.alpha * (0.65 + 0.35 * Math.sin(time * 0.0015 * s.twinkleSpeed * 60 + s.phase));

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(235, 242, 255, ${Math.max(0.08, Math.min(0.95, pulse)).toFixed(3)})`;
          ctx.fill();
        }

        if (!prefersReducedMotion) {
          requestAnimationFrame(drawStars);
        }
      }

      resize();
      requestAnimationFrame(drawStars);
      window.addEventListener('resize', resize, { passive: true });
    })();
  </script>

</body>
</html>
