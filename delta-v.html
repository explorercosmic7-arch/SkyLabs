  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #05070c;
      color: #f5f7fb;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 50% 22%, rgba(122, 162, 255, 0.14) 0%, transparent 52%),
        radial-gradient(circle at 18% 82%, rgba(255, 255, 255, 0.04) 0%, transparent 45%),
        #05070c;
    }

    .card {
      width: 100%;
      max-width: 540px;
      padding: 40px 32px;
      border-radius: 28px;
      background: rgba(12, 16, 26, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 10px;
      display: block;
    }

    .brand span {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .code {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #b8ceff;
      background: rgba(122, 162, 255, 0.12);
      border: 1px solid rgba(122, 162, 255, 0.24);
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 42px);
      font-weight: 400;
      line-height: 1.12;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: 14px;
    }

    p {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
      color: rgba(245, 247, 251, 0.76);
      max-width: 440px;
      margin: 0 auto 28px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 46px;
      padding: 0 24px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .btn-primary {
      background: #ffffff;
      color: #06080d;
    }

    .btn-primary:hover {
      background: #e8eefc;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.32);
      transform: translateY(-1px);
    }

    @media (max-width: 480px) {
      .card {
        padding: 32px 22px;
        border-radius: 22px;
      }
      .actions, .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="deltaVTitle">
    <div class="brand">
      <img
        src="Favicon.png"
        onerror="this.onerror=null; this.src='Logo.jpg';"
        alt="SkyLabs Logo"
      />
      <span>SkyLabs</span>
    </div>

    <div class="code">Next Edition · Not Live Yet</div>

    <h1 id="deltaVTitle">Delta-v Lab is coming soon</h1>

    <p>
      The Delta-v Lab will arrive in the next edition. Try another lab for now, or contact the developers if you want this lab prioritized.
    </p>

    <div class="actions">
      <a href="Labs.html" class="btn btn-primary">Explore Labs</a>
      <a href="Contact.html" class="btn btn-secondary">Contact Devs</a>
    </div>
  </main>
